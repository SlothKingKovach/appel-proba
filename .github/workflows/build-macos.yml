name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pyinstaller

      - name: Install FFmpeg
        run: |
          brew install ffmpeg

      - name: Check FFmpeg
        run: |
          which ffmpeg
          which ffprobe
          ffmpeg -version
          ffprobe -version

      - name: Build application
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --windowed \
            --name "Proskill Video Downloader" \
            video_downloader_gui.py

      - name: Add FFmpeg to application
        run: |
          mkdir -p "dist/Proskill Video Downloader.app/Contents/MacOS"
          cp "$(which ffmpeg)" "dist/Proskill Video Downloader.app/Contents/MacOS/ffmpeg"
          cp "$(which ffprobe)" "dist/Proskill Video Downloader.app/Contents/MacOS/ffprobe"

      - name: Create ZIP
        run: |
          cd dist
          zip -r "../Proskill-Video-Downloader-${{ matrix.arch }}.zip" \
            "Proskill Video Downloader.app"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Proskill-Video-Downloader-${{ matrix.arch }}
          path: Proskill-Video-Downloader-${{ matrix.arch }}.zip
